name: Build GTA6HUD.so
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tes parser config (host)
        run: g++ -std=c++17 -Wall -o tc test/test_config.cpp src/config.cpp && ./tc
      - name: Ambil header AML
        run: git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git AndroidModLoader
      - name: Build arm64-v8a
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - uses: actions/upload-artifact@v4
        with:
          name: GTA6HUD
          path: |
            build/libGTA6HUD.so
            test/GTA6HUD.ini
